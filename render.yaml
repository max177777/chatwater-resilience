# Render Blueprint — deploy with: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: chatwater-resilience
    runtime: node
    plan: free            # free instances sleep when idle; switch to "starter" for always-on
    buildCommand: npm ci && npm run build:library:release && npm test
    # Provision a protected artifact descriptor as /etc/secrets/chatwater-library-release.json first.
    # The build fails closed on absent/unapproved/hash-mismatched sources; no credentials in git.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true      # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      # AI backend: Gemini. Set the key in the Render dashboard (Environment), never in this file.
      - key: GEMINI_API_KEY      # enables AI chat and drafting; app works without it
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: low
    domains:
      - supermaxtest.com      # Render adds www.supermaxtest.com redirecting here
