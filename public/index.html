<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatWater Resilience</title>
  <meta name="description" content="From ECAM greenhouse gas assessment to project plan and financing proposal for water and wastewater utilities.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C11 11 7 15.5 7 20a9 9 0 0 0 18 0c0-4.5-4-9-9-17z' fill='%231F6F78'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C11 11 7 15.5 7 20a9 9 0 0 0 18 0c0-4.5-4-9-9-17z"/></svg><span data-t="brand"></span></div>
    <div class="top-right">
      <span id="ai-chip" class="chip ai-chip"></span>
      <span id="profile-chip" class="chip"></span>
      <div class="seg" role="group" aria-label="Location">
        <button data-loc="indonesia" data-t="loc_indonesia"></button>
        <button data-loc="global" data-t="loc_global"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="id">Bahasa</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="assess" data-t="tab_assess"></button>
    <button data-tab="actions" data-t="tab_actions"></button>
    <button data-tab="plan" data-t="tab_plan"></button>
    <button data-tab="finance" data-t="tab_finance"></button>
  </nav>
  <div class="banner" data-t="banner"></div>
  <div id="storage-alert" class="storage-alert" role="alert" hidden></div>

  <div class="layout">
    <main id="view" tabindex="-1"></main>
    <aside class="chat" id="chat">
      <div class="chat-head"><b data-t="chat_title"></b><span class="row" style="gap:4px"><button class="btn sm" id="chat-clear" data-t="clear_chat"></button><button class="icon-btn" id="chat-toggle" aria-label="Hide chat">–</button></span></div>
      <div class="chat-scope" id="chat-scope" aria-live="polite"></div>
      <div class="chat-body" id="chat-log"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="2"></textarea>
        <button class="btn primary" type="submit" data-t="send"></button>
      </form>
    </aside>
  </div>

  <footer class="bottom">
    <button class="btn" id="btn-checkpoint" data-t="save_checkpoint"></button>
    <span id="save-status" class="muted"></span>
  </footer>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <!-- ECAM v3 backend, unmodified (ICRA/IWA/GIZ, CC BY-SA 4.0) -->
  <script src="/ecam/backend/questions.js"></script>
  <script src="/ecam/backend/global.js"></script>
  <script src="/ecam/backend/info.js"></script>
  <script src="/ecam/backend/structure.js"></script>
  <script src="/ecam/backend/countries.js"></script>
  <script src="/ecam/backend/gwp_reports.js"></script>
  <script src="/ecam/backend/constants.js"></script>
  <script src="/ecam/backend/tables.js"></script>
  <script src="/ecam/backend/units.js"></script>
  <script src="/ecam/backend/estimations.js"></script>
  <script src="/ecam/backend/exceptions.js"></script>
  <script src="/ecam/backend/normalization.js"></script>
  <script src="/ecam/backend/formulas.js"></script>
  <script src="/ecam/backend/filters.js"></script>
  <script src="/ecam/backend/benchmarks.js"></script>
  <script src="/ecam/backend/references.js"></script>
  <script src="/ecam/backend/ipcc_categories.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/js/cw-core.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/action-sources.js"></script>
  <script src="/js/custom-actions.js"></script>
  <script src="/js/decision-cards.js"></script>
  <script src="/js/chat-view.js"></script>
  <script src="/js/ecam-form.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
