<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="t">
  <title id="t">A water utility landscape: rain over hills feeds a river, water is treated and piped to a town, used water is treated and returned, with solar panels and a falling emissions arrow</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F3F5"/><stop offset="1" stop-color="#F7FBFC"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BC0DA"/><stop offset="1" stop-color="#2E8FB0"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7D46F"/><stop offset="1" stop-color="#7DB548"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD0E6"/><stop offset="1" stop-color="#1F6F78"/></linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="520" height="340" rx="22" fill="url(#sky)"/>
  <!-- sun -->
  <g transform="translate(440 62)">
    <circle r="22" fill="#F6C543"/>
    <g stroke="#F6C543" stroke-width="4" stroke-linecap="round">
      <path d="M0 -34v-8M0 34v8M-34 0h-8M34 0h8M-24 -24l-6 -6M24 24l6 6M-24 24l-6 6M24 -24l6 -6"/>
    </g>
  </g>
  <!-- rain cloud -->
  <g transform="translate(92 54)">
    <g fill="#9AA9B1"><circle cx="0" cy="12" r="18"/><circle cx="22" cy="2" r="22"/><circle cx="46" cy="12" r="17"/><rect x="-6" y="12" width="58" height="18" rx="9"/></g>
    <g stroke="#3BA8C4" stroke-width="3" stroke-linecap="round"><path d="M2 40l-4 12M18 42l-4 12M34 40l-4 12M50 42l-4 12"/></g>
  </g>
  <!-- small cloud -->
  <g fill="#FFFFFF" opacity=".9" transform="translate(300 46)"><circle cx="0" cy="10" r="12"/><circle cx="16" cy="4" r="15"/><circle cx="32" cy="10" r="11"/><rect x="-4" y="10" width="40" height="11" rx="5"/></g>

  <!-- hills -->
  <path d="M10 196 L80 120 L128 168 L168 128 L238 196 Z" fill="#6E9F4E"/>
  <path d="M80 120 L96 138 L80 146 L66 136 Z" fill="#FFFFFF" opacity=".55"/>
  <!-- land -->
  <path d="M0 190 C120 178 220 200 330 186 C410 176 470 186 520 182 L520 318 Q520 340 498 340 L22 340 Q0 340 0 318 Z" fill="url(#land)"/>
  <!-- river from hills to lower left -->
  <path d="M140 190 C150 220 110 236 120 262 C130 290 90 306 60 340 L104 340 C126 312 168 296 160 266 C152 238 186 222 176 190 Z" fill="url(#river)"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".7" fill="none"><path d="M150 214q8 4 14 0M132 262q8 4 14 0M104 306q8 4 14 0"/></g>

  <!-- intake pipe and water treatment (round tanks) -->
  <path d="M168 238 H214" stroke="#1F6F78" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(244 236)">
    <ellipse cx="0" cy="8" rx="30" ry="12" fill="#17565D"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#5BC0DA" stroke="#1F6F78" stroke-width="3"/>
    <path d="M-30 0v8M30 0v8" stroke="#1F6F78" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="12" ry="4.5" fill="#FFFFFF" opacity=".6"/>
  </g>
  <g transform="translate(300 262)">
    <ellipse cx="0" cy="7" rx="22" ry="9" fill="#17565D"/>
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="#7FD3E6" stroke="#1F6F78" stroke-width="3"/>
    <path d="M-22 0v7M22 0v7" stroke="#1F6F78" stroke-width="3"/>
  </g>

  <!-- distribution pipe to town (dashed flow) -->
  <path d="M272 236 C320 236 330 214 370 214" stroke="#1F6F78" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M272 236 C320 236 330 214 370 214" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-dasharray="4 7" stroke-linecap="round"/>

  <!-- town -->
  <g transform="translate(366 150)">
    <rect x="0" y="34" width="26" height="44" rx="2" fill="#3BA8C4"/>
    <rect x="30" y="14" width="30" height="64" rx="2" fill="#2E8FB0"/>
    <rect x="64" y="40" width="24" height="38" rx="2" fill="#E9876F"/>
    <rect x="92" y="26" width="22" height="52" rx="2" fill="#5BC0DA"/>
    <g fill="#FFFFFF" opacity=".85">
      <rect x="5" y="42" width="5" height="5"/><rect x="15" y="42" width="5" height="5"/><rect x="5" y="54" width="5" height="5"/><rect x="15" y="54" width="5" height="5"/>
      <rect x="36" y="22" width="6" height="6"/><rect x="48" y="22" width="6" height="6"/><rect x="36" y="34" width="6" height="6"/><rect x="48" y="34" width="6" height="6"/><rect x="36" y="46" width="6" height="6"/><rect x="48" y="46" width="6" height="6"/>
      <rect x="69" y="48" width="5" height="5"/><rect x="78" y="48" width="5" height="5"/><rect x="97" y="34" width="5" height="5"/><rect x="105" y="34" width="5" height="5"/><rect x="97" y="46" width="5" height="5"/><rect x="105" y="46" width="5" height="5"/>
    </g>
    <!-- solar panels on the roof -->
    <g transform="translate(30 6) skewX(-20)"><rect x="4" y="0" width="12" height="7" fill="#1F4E79"/><rect x="18" y="0" width="12" height="7" fill="#1F4E79"/></g>
  </g>

  <!-- used-water pipe to wastewater treatment and back to the river -->
  <path d="M420 230 C420 262 396 286 356 292" stroke="#C95B44" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g transform="translate(330 296)">
    <ellipse cx="0" cy="7" rx="24" ry="9" fill="#9E4332"/>
    <ellipse cx="0" cy="0" rx="24" ry="9" fill="#F0A08C" stroke="#C95B44" stroke-width="3"/>
    <path d="M-24 0v7M24 0v7" stroke="#C95B44" stroke-width="3"/>
  </g>
  <path d="M306 300 C250 318 190 314 150 300" stroke="#3BA8C4" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- droplet with falling emissions arrow -->
  <g transform="translate(466 238)">
    <path d="M0 -40 C14 -18 26 -4 26 12 A26 26 0 0 1 -26 12 C-26 -4 -14 -18 0 -40 Z" fill="url(#drop)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">CO₂</text>
    <path d="M0 18v12M-6 24l6 7 6 -7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
